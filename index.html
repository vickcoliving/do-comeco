<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vick Coliving 🏢</title>
    <style>
        /* Estilos Gerais baseados na imagem */
        body {
            font-family: 'Arial Black', sans-serif;
            background-color: #f7e6cc; /* Tom bege de fundo da imagem */
            color: #1e1e1e;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .header-container {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #000;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #4a4a4a;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Seção das Salas (Estilo Selo Postal/The Sims) */
        .rooms-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .room-card {
            background-color: #3d5236; /* Verde escuro das bordas serrilhadas */
            padding: 15px;
            border-radius: 4px;
            width: 220px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            /* Efeito serrilhado simulado (pode ser trocado por imagem depois) */
            border: 4px dashed #f7e6cc; 
            transition: transform 0.2s;
            cursor: pointer;
        }

        .room-card:hover {
            transform: scale(1.05);
        }

        .room-image {
            width: 100%;
            height: 150px;
            background-color: #666; /* Fundo reserva caso a foto suma */
            border-radius: 2px;
            object-fit: cover;
        }

        .room-title {
            background-color: #ffcc00; /* Amarelo dos botões de tag */
            color: #000;
            padding: 5px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 15px;
            display: inline-block;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Logotipo Principal -->
        <h1>Vick Coliving</h1>
        <div class="subtitle">Escolha a sua sala! 🏢✨</div>
    </div>

    <!-- Container com os Cards das Salas -->
    <div class="rooms-container">
        
        <!-- Sala 1 -->
        <div class="room-card">
            <!-- Substitua 'sala1.png' pelo nome real da imagem do quarto no seu GitHub -->
            <img src="sala1.png" alt="Sala de Estar" class="room-image">
            <div class="room-title">Sala de Estar</div>
        </div>

        <!-- Sala 2 -->
        <div class="room-card">
            <!-- Substitua 'sala2.png' pelo nome real da imagem -->
            <img src="sala2.png" alt="Cozinha Comunitária" class="room-image">
            <div class="room-title">Cozinha Coletiva</div>
        </div>

        <!-- Sala 3 -->
        <div class="room-card">
            <!-- Substitua 'sala3.png' pelo nome real da imagem -->
            <img src="sala3.png" alt="Quarto Principal" class="room-image">
            <div class="room-title">Quarto Gamer</div>
        </div>

    </div>

</body>
</html>
